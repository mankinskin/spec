[package]
name = "spec-viewer"
version = "0.1.0"
edition = "2021"
description = "HTTP server and SPA frontend for viewing and navigating the specification database"

[[bin]]
name = "spec-viewer"
path = "src/main.rs"

[dependencies]
# Spec crates
spec-api  = { path = "../crates/spec-api" }
spec-http = { package = "spec", path = "..", features = ["http"] }

# Shared viewer infrastructure
viewer-api = { git = "https://github.com/mankinskin/viewer-api", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
tracing = "0.1"

[dev-dependencies]
tempfile   = "3"
tower      = { version = "0.5", features = ["util"] }
serde_json = "1"
