[package]
name = "spec-api"
version = "0.1.0"
edition = "2024"
description = "Specification system: manifest model, storage, and domain logic"

[dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
feedback-api = { git = "https://github.com/mankinskin/feedback", branch = "main" }
test-api = { git = "https://github.com/mankinskin/test", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main", features = ["testing"] }
pretty_assertions = "1"
tempfile = "3"
memory-fixtures = { git = "https://github.com/mankinskin/memory-fixtures", branch = "main" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "move_health"
harness = false
