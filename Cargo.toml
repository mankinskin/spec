[package]
name = "spec"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = [
  "crates/spec-api",
]

 [features]
 default = []
cli = ["dep:chrono", "dep:clap", "dep:memory-kernel", "dep:proc-macro2", "dep:rule-api", "dep:serde", "dep:serde_json", "dep:syn", "dep:thiserror", "dep:ticket-api", "dep:toon-format", "dep:uuid", "dep:walkdir"]
 mcp = ["dep:chrono", "dep:memory-kernel", "dep:rmcp", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:uuid"]
 http = ["dep:axum", "dep:chrono", "dep:futures-util", "dep:memory-kernel", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tower-http", "dep:tracing", "dep:uuid", "dep:viewer-api"]

[[bin]]
name = "spec"
path = "src/bin/spec.rs"
required-features = ["cli"]

[[bin]]
name = "spec-mcp"
path = "src/bin/spec-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "spec-http"
path = "src/bin/spec-http.rs"
required-features = ["http"]

[lib]
path = "src/lib.rs"

[dependencies]
spec-api = { path = "crates/spec-api" }
ticket-api = { git = "https://github.com/mankinskin/memory-api", branch = "main", optional = true }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main", optional = true }
rule-api = { git = "https://github.com/mankinskin/memory-api", branch = "main", optional = true }
axum = { version = "0.8", features = ["macros"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
futures-util = { version = "0.3", optional = true }
rmcp = { version = "0.14", features = ["server", "transport-io"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
toon-format = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }
viewer-api = { git = "https://github.com/mankinskin/viewer-api", branch = "main", optional = true }
proc-macro2 = { version = "1.0", features = ["span-locations"], optional = true }
syn = { version = "2.0", features = ["full", "parsing", "visit"], optional = true }
walkdir = { version = "2.4", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "bootstrap_tests"
path = "tests/bootstrap_tests.rs"
required-features = ["cli"]

[[test]]
name = "toon_output"
path = "tests/toon_output.rs"
required-features = ["cli"]

[[test]]
name = "mcp_smoke"
path = "tests/mcp_smoke.rs"
required-features = ["mcp"]

[[test]]
name = "http_integration"
path = "tests/http_integration.rs"
required-features = ["http"]
